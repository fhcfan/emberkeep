<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emberkeep — a lantern-keeper's night</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060f;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        background: #0a0d1f;
        border-radius: 6px;
        box-shadow: 0 0 60px rgba(123, 92, 255, 0.18);
      }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="600" aria-label="Emberkeep game canvas"></canvas>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
